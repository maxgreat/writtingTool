[package]
name = "writing-tool"
version = "0.1.0"
description = "A writing app for novels: binder, editor and inspector over plain Markdown chapters"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which Cargo needs on Windows (rust-lang/cargo#8519).
name = "writing_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7.4"
spellbook = "=0.4.2"
# Grammar for English, offline. Its spelling rules are left out: the dictionaries above check spelling.
harper-core = { version = "=3.0.0", default-features = false, features = ["concurrent"] }
# The opt-in LanguageTool connection: rustls with bundled roots, nothing platform-specific on Android.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27"

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
