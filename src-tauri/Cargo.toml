[package]
name = "writing-tool"
version = "0.1.0"
description = "A writing app for novels: binder, editor and inspector over plain Markdown chapters"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which Cargo needs on Windows (rust-lang/cargo#8519).
name = "writing_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
# preserve_order: a merged project.json keeps its keys in the order they were written.
serde_json = { version = "1", features = ["preserve_order"] }
include_dir = "0.7.4"
spellbook = "=0.4.2"
# Grammar for English, offline. Its spelling rules are left out: the dictionaries above check spelling.
harper-core = { version = "=3.0.0", default-features = false, features = ["concurrent"] }
# Export: Typst lays out the preview's pages and the PDF; EPUB and Word are written from the same model.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
docx-rs = { version = "=0.4.22", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
# Writes an exported file where the save dialog chose, Android's content:// places included.
tauri-plugin-fs = "=2.7.1"
# The opt-in LanguageTool connection: rustls with bundled roots, nothing platform-specific on Android.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
# Dropbox sign-in with PKCE: random values, the SHA-256 challenge, addresses.
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"

# Desktops keep the Dropbox sign-in in the system's keyring (Secret Service
# on Linux, through the dbus library the window already uses).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Phones get Dropbox's answer to a sign-in through a link the app opens.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "=2.4.10"

[dev-dependencies]
tempfile = "3.27"

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
