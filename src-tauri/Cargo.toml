[package]
name = "writing-tool"
version = "0.1.0"
description = "A writing app for novels: binder, editor and inspector over plain Markdown chapters"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which Cargo needs on Windows (rust-lang/cargo#8519).
name = "writing_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
include_dir = "0.7.4"

[dev-dependencies]
tempfile = "3.27"

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
